[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mriforge"
version = "0.3.3"
authors = [{ name = "Eisa Hedayati" }]
description = "MRI processing, reconstruction, quantitative MRI, and DICOM/NIfTI tools for Python"
readme = "README.md"

requires-python = ">=3.10"

keywords = [
    "MRI",
    "medical imaging",
    "DICOM",
    "NIfTI",
    "quantitative MRI",
    "MRI reconstruction",
    "T2 star",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "License :: Other/Proprietary License",
]

license = { file = "LICENSE" }

# Lightweight dependencies needed by the core numerical functionality.
dependencies = [
    "numpy>=1.26,<3",
    "scipy>=1.13,<2",
    "tqdm>=4.66",
]

[project.urls]
Homepage = "https://github.com/ehedayati/mriforge"
Repository = "https://github.com/ehedayati/mriforge"
Issues = "https://github.com/ehedayati/mriforge/issues"

[project.scripts]
mriforge-dicom-to-nifti = "mrif.cli.dicom_to_nifti:main"
mriforge-t2star = "mrif.cli.t2star:main"

[project.optional-dependencies]

# DICOM / NIfTI / HDF5 I/O
io = [
    "h5py>=3.11",
    "nibabel>=5.2,<6",
    "pydicom>=2.4,<4",
    "SimpleITK>=2.3",
]

# DataFrame-related utilities
data = [
    "pandas>=2.1,<4",
]

# Plotting and interactive visualization
viz = [
    "matplotlib>=3.8",
    "ipywidgets>=8.1",
    "ipython>=8.20",
    "ipympl>=0.9.5",
]

# PyTorch-based reconstruction and quantitative MRI
torch = [
    "torch>=2.2",
]

# Everything needed for all MRIForge functionality
all = [
    "h5py>=3.11",
    "pandas>=2.1,<4",
    "nibabel>=5.2,<6",
    "pydicom>=2.4,<4",
    "matplotlib>=3.8",
    "torch>=2.2",
    "SimpleITK>=2.3",
    "ipywidgets>=8.1",
    "ipython>=8.20",
    "ipympl>=0.9.5",
]

# Development / testing tools
dev = [
    "pytest>=8",
    "ruff>=0.4.8",
    "build",
    "twine",
]

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["mrif.segmentation*"]

[tool.setuptools.package-data]
"*" = ["*.pyi", "py.typed"]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src"]


[tool.ruff.lint]
select = [
    "E4",  # pycodestyle: imports and whitespace
    "E7",  # pycodestyle: statements
    "E9",  # pycodestyle: runtime/syntax errors
    "F",   # Pyflakes: undefined names, unused imports, etc.
    "I",   # import sorting
    "B",   # flake8-bugbear: likely bugs and problematic patterns
]

ignore = [
    "E731",  # Allow assigned lambdas for concise local numerical helpers
]

[tool.ruff.lint.isort]
known-first-party = ["mrif"]


[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

